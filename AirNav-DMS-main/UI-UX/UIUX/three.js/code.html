<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_13 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_13" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_13');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const container = document.querySelector('#auth-container');
const loginSide = document.querySelector('#login-side');
const registerSide = document.querySelector('#register-side');
const illustrationLayer = document.querySelector('#illustration-layer');
const airplane = document.querySelector('#airplane-asset');
const wavePath = document.querySelector('#wave-path');

// State tracking
let isRegister = false;

// Shared constants
const DURATION = 850;
const EASE = 'cubic-bezier(0.65, 0, 0.35, 1)';

function toggleAuth() {
    isRegister = !isRegister;
    
    // 1. Flip the container layout
    container.classList.toggle('flex-row-reverse', isRegister);
    
    // 2. Animate the form container (Sliding effect)
    const forms = document.querySelectorAll('.auth-form-card');
    forms.forEach(form => {
        form.style.transition = `transform ${DURATION}ms ${EASE}, opacity ${DURATION}ms ${EASE}`;
    });

    if (isRegister) {
        // Transition to Register
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('register-form').classList.remove('hidden');
        
        // Plane Flight Path: Diagonal ascent
        airplane.style.transition = `transform ${DURATION}ms ${EASE}`;
        airplane.style.transform = 'translate(120%, -30%) rotate(-15deg) scale(0.8)';
        
        // Wave Divider Morphing
        wavePath.style.transition = `d ${DURATION}ms ${EASE}`;
        wavePath.setAttribute('d', 'M0,160L48,144C96,128,192,96,288,106.7C384,117,480,171,576,170.7C672,171,768,117,864,117.3C960,117,1056,171,1152,202.7C1248,235,1344,245,1392,250.7L1440,256L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z');
    } else {
        // Transition back to Login
        document.getElementById('register-form').classList.add('hidden');
        document.getElementById('login-form').classList.remove('hidden');
        
        // Reset Plane
        airplane.style.transform = 'translate(0, 0) rotate(0deg) scale(1)';
        
        // Reset Wave
        wavePath.setAttribute('d', 'M0,160L48,176C96,192,192,224,288,213.3C384,203,480,149,576,149.3C672,149,768,203,864,202.7C960,203,1056,149,1152,117.3C1248,85,1344,75,1392,69.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z');
    }
}

// Attach listeners to "Create Account" and "Sign In" toggle links
document.addEventListener('DOMContentLoaded', () => {
    const toggles = document.querySelectorAll('.auth-toggle');
    toggles.forEach(btn => btn.addEventListener('click', (e) => {
        e.preventDefault();
        toggleAuth();
    }));
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_13 -->
</body>
</html>
