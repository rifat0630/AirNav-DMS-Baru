<!DOCTYPE html>

<style>
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Floating label styles */
        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            transform: translateY(-130%) scale(0.85);
            color: theme('colors.primary');
            background-color: white;
            padding: 0 4px;
        }
    </style>

<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden antialiased">
<!-- Split Layout Container -->
<div class="flex h-screen w-full">
<!-- Left Side: Branding & Visuals (45%) -->
<div class="hidden lg:flex flex-col w-[45%] relative bg-gradient-to-b from-[#F7F9FC] to-[#EBF3FF] overflow-hidden">
<!-- Content -->
<div class="relative z-10 flex flex-col justify-center h-full p-2xl">
<div class="max-w-md mx-auto">
<h1 class="font-display-lg text-display-lg text-primary mb-md">Welcome Back</h1>
<p class="font-body-lg text-body-lg text-secondary mb-xl">Sign in to access the AirNav Document Management System. Your mission-critical documents, secure and readily available.</p>
</div>
</div>
<!-- 3D Illustration -->
<div class="absolute inset-0 flex items-center justify-center opacity-80 z-0 pointer-events-none mix-blend-multiply">
<img alt="" class="object-cover w-full h-full max-w-[800px] max-h-[800px]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqkUc1pZoi6Xaet44NxGYfj5DSKi6hnQYgdKyJYnPeLGlaXVb2dpzJAbPCnbcqe2o6obOp7pomsr9D0WKH9xLLrh4q5DqLjYcjrm5-GfSwe-zYB4PCE8SR8_JujDrnzXLrqIMR2LZIXkM3kTxNdX1PR-ie1VHM_OTEKrcHZh4qcwPhRKQh-vLS6Tf6zhDnUrm7UWV9t_IC8zZuyc0CMDU40t_SHDqFa5gzL75pIz9bhkAaI1fX3xjI2-5Nvlp5ocA3ehrVAJJJBAM"/>
</div>
<!-- Wave Divider at Seam -->
<div class="absolute right-0 top-0 bottom-0 h-full flex flex-col justify-center translate-x-1/2 opacity-20 pointer-events-none z-20">
<img alt="" class="h-full w-auto object-cover transform rotate-90" src="https://lh3.googleusercontent.com/aida/AP1WRLv7n6809oTM9T5ULHqGCP5n5VVlx6OH1d2A1UkP7H12NANASwFOLqSi_atQ0gV7L4i8K0X8PeHUr0DEFJBn5pEAY19PUMBcr-rMgmvR63NZLx2TMk6WlJKzO0kLJMD8DSDmboroJY5UrDM1QnhAqG7jTRX3tgaoFM5geslOu4jcPhxg49ZOTZMIv3YZaG-WxcipijPNDz74rrOblBNcEYUzXUtfWdZi_UFpyrGRXlrbWxsOV3wqTj2XMA"/>
</div>
</div>
<!-- Right Side: Authentication (55%) -->
<div class="w-full lg:w-[55%] flex items-center justify-center bg-surface relative z-30 shadow-[-10px_0_30px_rgba(0,0,0,0.03)] p-margin-mobile md:p-margin-desktop">
<!-- Auth Card -->
<div class="w-full max-w-[480px] bg-surface-container-lowest rounded-[20px] p-xl shadow-[0px_4px_24px_rgba(15,23,42,0.06)] border border-surface-variant fade-in-up">
<!-- Brand Header Mobile (Hidden on Desktop) -->
<div class="lg:hidden text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">AirNav DMS</h1>
</div>
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Sign In</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your credentials to continue</p>
</div>
<form class="space-y-lg">
<!-- Email Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="floating-input w-full h-[48px] pl-[48px] pr-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all peer" id="email" placeholder=" " required="" type="email"/>
<label class="floating-label absolute left-[48px] top-1/2 -translate-y-1/2 text-body-md text-outline transition-all duration-200 pointer-events-none origin-left" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="floating-input w-full h-[48px] pl-[48px] pr-md bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all peer" id="password" placeholder=" " required="" type="password"/>
<label class="floating-label absolute left-[48px] top-1/2 -translate-y-1/2 text-body-md text-outline transition-all duration-200 pointer-events-none origin-left" for="password">Password</label>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 transition-colors" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Action Buttons -->
<div class="pt-sm space-y-md">
<button class="w-full flex items-center justify-center gap-sm h-[48px] bg-gradient-to-r from-primary to-surface-tint text-on-primary rounded-full font-label-md text-label-md hover:shadow-[0px_4px_12px_rgba(0,74,198,0.2)] hover:scale-[1.01] active:scale-[0.99] transition-all duration-200" type="submit">
                            Sign In
                            <span class="material-symbols-outlined text-[20px]">arrow_right_alt</span>
</button>
<button class="w-full flex items-center justify-center h-[48px] bg-surface-container-lowest border border-outline-variant text-on-surface rounded-full font-label-md text-label-md hover:bg-surface-container-low active:bg-surface-container transition-colors duration-200" type="button">
                            Back to Home
                        </button>
</div>
</form>
<!-- Footer -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-label-md text-label-md text-primary hover:underline ml-xs" href="#">Create Account</a>
</p>
</div>
</div>
</div>
</div>
</body></html>
