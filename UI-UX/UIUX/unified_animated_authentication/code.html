<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .transition-transform-layout {
            transition: transform 850ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .fade-slide-enter {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .fade-slide-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 500ms ease-out 300ms, transform 500ms ease-out 300ms;
        }
        
        .fade-slide-exit {
            opacity: 1;
            transform: translateY(0);
        }
        
        .fade-slide-exit-active {
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 300ms ease-in, transform 300ms ease-in;
        }

        .rotate-infinite {
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .airplane-fly {
            transition: transform 850ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .airplane-state-login {
            transform: translate(0, 0) scale(1);
        }

        .airplane-state-register {
            transform: translate(-100px, -50px) scale(0.9) rotate(-15deg);
        }
    </style>

<!-- Airplane Asset -->

</div>
<!-- Side B: Form Panel -->
<div class="transition-transform-layout absolute md:relative z-20 w-full h-[60%] top-[40%] md:top-0 md:h-full md:w-[55%] left-0 md:left-[45%] flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface rounded-t-3xl md:rounded-none" id="side-b">

<!-- Login Form -->
<div class="w-full transition-opacity duration-300" id="form-login">
<div class="mb-lg">

<form class="space-y-md" onsubmit="event.preventDefault();">
<div>

</div>
<button class="w-full h-10 bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md rounded transition-colors mt-md shadow-sm">
                            Create Account
                        </button>
</form>
<p class="mt-md text-center font-body-sm text-body-sm text-secondary">
                        Already have an account? <button class="text-primary font-label-md hover:underline" id="btn-to-login">Sign In</button>
</p>

</div>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sideA = document.getElementById('side-a');
            const sideB = document.getElementById('side-b');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');
            const airplaneAsset = document.getElementById('airplane-asset');
            
            const btnToRegister = document.getElementById('btn-to-register');
            const btnToLogin = document.getElementById('btn-to-login');

            let isDesktop = window.innerWidth >= 768;
            window.addEventListener('resize', () => {
                isDesktop = window.innerWidth >= 768;
                // Reset transforms on resize for simplicity in this demo
                sideA.style.transform = '';
                sideB.style.transform = '';
            });

            function toggleView(toRegister) {
                if (isDesktop) {
                    if (toRegister) {
                        sideA.style.transform = 'translateX(122.22%)'; // 55 / 45 approx
                        sideB.style.transform = 'translateX(-81.81%)'; // 45 / 55 approx
                        airplaneAsset.classList.remove('airplane-state-login');
                        airplaneAsset.classList.add('airplane-state-register');
                    } else {
                        sideA.style.transform = 'translateX(0)';
                        sideB.style.transform = 'translateX(0)';
                        airplaneAsset.classList.add('airplane-state-login');
                        airplaneAsset.classList.remove('airplane-state-register');
                    }
                } else {
                     // Mobile simple fade or slight vertical shift logic could go here
                }

                // Form fade logic
                if (toRegister) {
                    formLogin.style.opacity = '0';
                    setTimeout(() => {
                        formLogin.classList.add('hidden');
                        formRegister.classList.remove('hidden');
                        // Small delay to allow display block to apply before opacity transition
                        setTimeout(() => {
                            formRegister.style.opacity = '1';
                        }, 50);
                    }, 300);
                } else {
                    formRegister.style.opacity = '0';
                    setTimeout(() => {
                        formRegister.classList.add('hidden');
                        formLogin.classList.remove('hidden');
                        setTimeout(() => {
                            formLogin.style.opacity = '1';
                        }, 50);
                    }, 300);
                }
            }

            btnToRegister.addEventListener('click', () => toggleView(true));
            btnToLogin.addEventListener('click', () => toggleView(false));
        });
    </script>
