<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AirNav DMS - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0057D9",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#eeefff",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary-fixed": "#0b1c30",
                        "on-primary-fixed-variant": "#003ea8",
                        "background": "#f7f9fd",
                        "outline": "#737686",
                        "inverse-primary": "#b4c5ff",
                        "on-tertiary-container": "#e4f2ff",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container": "#eceef2",
                        "inverse-on-surface": "#eff1f5",
                        "secondary": "#505f76",
                        "tertiary-fixed-dim": "#89ceff",
                        "inverse-surface": "#2d3134",
                        "surface-dim": "#d8dade",
                        "outline-variant": "#c3c6d7",
                        "surface-variant": "#e0e3e6",
                        "tertiary-fixed": "#c9e6ff",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary-fixed": "#dbe1ff",
                        "error": "#ba1a1a",
                        "primary-container": "#2563eb",
                        "surface-container-highest": "#e0e3e6",
                        "on-primary-fixed": "#00174b",
                        "surface-tint": "#0053db",
                        "surface-container-high": "#e6e8ec",
                        "secondary-fixed": "#d3e4fe",
                        "on-surface": "#181c1f",
                        "on-background": "#181c1f",
                        "secondary-container": "#d0e1fb",
                        "tertiary-container": "#0074a6",
                        "on-secondary-container": "#54647a",
                        "surface-bright": "#f7f9fd",
                        "surface-container-low": "#f2f4f8",
                        "on-tertiary-fixed": "#001e2f",
                        "on-surface-variant": "#434655",
                        "on-primary": "#ffffff",
                        "tertiary": "#005a82",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "surface": "#f7f9fd",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "32px",
                        "3xl": "64px",
                        "container-max": "1440px",
                        "sm": "8px",
                        "xs": "4px",
                        "2xl": "48px",
                        "md": "16px",
                        "xl": "32px",
                        "unit": "8px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Floating label styles */
        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            transform: translateY(-130%) scale(0.85);
            color: theme('colors.primary');
            background-color: transparent;
            padding: 0 4px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden antialiased">
<!-- Split Layout Container -->
<div class="flex h-screen w-full">
<!-- Left Side: Branding & Visuals (45%) -->
<div class="hidden lg:flex flex-col w-[45%] relative bg-[#090c15] overflow-hidden">
<!-- 3D Illustration -->
<div class="absolute inset-0 flex items-center justify-center z-0 pointer-events-none">
<img alt="Aviation Technology" class="object-cover w-full h-full" src="https://lh3.googleusercontent.com/aida/AP1WRLtQqiAR-usTUZiBL3QelSYRb4-xHJbOnn9CurvH0hlWdNboVFEgWRo4m591FnqQKbs9RAxy7sUpwrxY-nYVtFBPm8UInCXdIOIsW6tOhGCt4SwxQGTZZ5sKqpFnrV8qe9hMYdqdhGp8g9rNikZAwsvoYF5p4PzbuhCXDOZhhu-uhZ4zyGR6Wwh46g-8YRiNd8CcdYOzsROUjn_Z67kNZnudSaiadHVVVRnzpKGw3nWCxAfwJrnRNNlegws"/>
<div class="absolute inset-0 bg-gradient-to-b from-[#090c15]/60 via-transparent to-[#090c15]/80"></div>
</div>
<!-- Content -->
<div class="relative z-10 flex flex-col justify-end h-full p-3xl pb-[100px]">
<div class="max-w-md mx-auto w-full">
<h1 class="font-display-lg text-display-lg text-white mb-md drop-shadow-lg">Welcome Back</h1>
<p class="font-body-lg text-body-lg text-white/90 mb-xl drop-shadow-md">Sign in to access the AirNav Document Management System. Your mission-critical documents, secure and readily available.</p>
</div>
</div>
</div>
<!-- Right Side: Authentication (55%) -->
<div class="w-full lg:w-[55%] flex items-center justify-center bg-surface relative z-30 shadow-[-20px_0_40px_rgba(0,0,0,0.05)] p-margin-mobile md:p-margin-desktop">
<!-- Organic Wave Divider -->
<div class="absolute left-0 top-0 h-full w-[120px] -translate-x-[99%] text-surface pointer-events-none hidden lg:block z-20">
<svg class="h-full w-full drop-shadow-[10px_0_20px_rgba(0,0,0,0.03)]" fill="currentColor" preserveaspectratio="none" viewbox="0 0 100 100">
<path d="M100,0 C40,20 40,80 100,100 Z"></path>
</svg>
</div>
<!-- Auth Card -->
<div class="w-full max-w-[480px] bg-white/80 backdrop-blur-xl rounded-[24px] p-xl shadow-[0_8px_32px_rgba(0,0,0,0.06)] border border-white/40 fade-in-up relative z-30">
<!-- Brand Header Mobile (Hidden on Desktop) -->
<div class="lg:hidden text-center mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">AirNav DMS</h1>
</div>
<div class="mb-xl">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs font-semibold">Sign In</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your credentials to continue</p>
</div>
<form class="space-y-lg">
<!-- Email Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="floating-input w-full h-[52px] pl-[48px] pr-md bg-transparent border border-outline-variant rounded-xl text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all peer hover:border-outline" id="email" placeholder=" " required="" type="email"/>
<label class="floating-label absolute left-[44px] top-1/2 -translate-y-1/2 text-body-md text-outline transition-all duration-200 pointer-events-none origin-left bg-white/80 backdrop-blur-sm px-1" for="email">Email Address</label>
</div>
<!-- Password Field -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="floating-input w-full h-[52px] pl-[48px] pr-md bg-transparent border border-outline-variant rounded-xl text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all peer hover:border-outline" id="password" placeholder=" " required="" type="password"/>
<label class="floating-label absolute left-[44px] top-1/2 -translate-y-1/2 text-body-md text-outline transition-all duration-200 pointer-events-none origin-left bg-white/80 backdrop-blur-sm px-1" for="password">Password</label>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center gap-sm cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 transition-colors" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-[#004ac6] transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Action Buttons -->
<div class="pt-lg space-y-md">
<button class="w-full flex items-center justify-center gap-sm h-[52px] bg-gradient-to-r from-[#0057D9] to-[#0070F3] text-white rounded-full font-label-md text-label-md hover:shadow-[0_8px_16px_rgba(0,87,217,0.25)] hover:-translate-y-[1px] active:translate-y-[0px] transition-all duration-200" type="submit">
                            Sign In
                            <span class="material-symbols-outlined text-[20px]">arrow_right_alt</span>
</button>
<button class="w-full flex items-center justify-center h-[52px] bg-white/50 border border-outline-variant text-on-surface rounded-full font-label-md text-label-md hover:bg-white active:bg-surface-container-low transition-colors duration-200" type="button">
                            Back to Home
                        </button>
</div>
</form>
<!-- Footer -->
<div class="mt-2xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-label-md text-label-md text-primary hover:underline ml-xs" href="#">Create Account</a>
</p>
</div>
</div>
</div>
</div>
</body></html>
